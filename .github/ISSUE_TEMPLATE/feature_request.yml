name: 功能请求
description: 想要新的能力，或现有能力不够用
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        动手之前先看清范围：[docs/product.md](https://github.com/marsken88/dsh-studio/blob/main/docs/product.md)
        里写了 V1 范围与**明确不做**的清单（多租户、向量库/RAG、自动签字/自动发布、全量事件溯源…）。
        在「不做」清单里的想法，请先说明为什么应该改这个判断。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述真实场景，不要先给方案。谁在什么情况下被卡住了？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      description: 界面在哪、数据从哪来、什么算完成（可观察的验收标准最有说服力）

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在是怎么绕过去的？为什么不够用？

  - type: dropdown
    id: willingness
    attributes:
      label: 你愿意提 PR 吗
      options:
        - 愿意，我可以按 CONTRIBUTING 提 PR
        - 愿意，但需要有人带一下（指个大概位置）
        - 只想提需求，暂时没时间写代码
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 我读过 docs/product.md，这个需求不在「明确不做」的清单里（或我在上面说明了为什么应该改判断）
          required: true
