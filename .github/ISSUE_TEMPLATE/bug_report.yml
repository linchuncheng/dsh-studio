name: Bug 报告
description: 面板、工具、派单或门禁行为不对时用这个模板
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        贴日志前请**先脱敏**：`/studio-api/state` 里有成员名单，`?token=…` 是登录凭据，
        `~/.dsh/dsh-studio.secrets.json` 里是令牌 —— 这些都不要贴出来。
        安全问题**不要开公开 issue**，见 [SECURITY.md](https://github.com/marsken88/dsh-studio/blob/main/SECURITY.md)。

  - type: input
    id: studio-version
    attributes:
      label: dsh-studio 版本
      description: 面板右下角、或 `npm view @marsken/dsh-studio version`（也可以看 package.json）
      placeholder: 0.8.1
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本与 profile
      description: Desktop 还是 Web？profile 名是什么（desktop / web / 自定义）？
      placeholder: DSH 1.x · web profile
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的位置
      options:
        - 看板 / 卡片抽屉
        - 工作台
        - 需求页
        - 用例库
        - 版本页
        - 效能页
        - 设置（权限 / 集成 / 派单）
        - agent 工具（studio_*）
        - 派单 / 会话
        - 门禁 / 准出
        - 其他（下面说明）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，越具体越好；能贴请求/命令就贴
      placeholder: |
        1. 打开看板 → 点某张卡
        2. 点「推进到待验收」
        3. 期望 A，实际 B
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图（已脱敏）
      description: |
        有用的来源：
        - 浏览器 console 的报错（面板白屏时尤其重要）
        - `sudo journalctl -u dsh-web -n 200 --no-pager`
        - `GET /studio-api/integrations`（集成健康）
        - 卡片抽屉里的「历史」与「派单记录」
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已经把 token、口令、成员名单等敏感信息去掉
          required: true
        - label: 我搜过已有 issue，没有重复
          required: false
