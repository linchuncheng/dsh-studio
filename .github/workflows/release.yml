name: release

# 打 tag（v0.2.2 这种）自动发版到 npm。凭证走 **Trusted Publishing（OIDC）**，仓库里不放令牌。
#
# 为什么不用令牌：
#   · 手工 `npm publish` 每次都卡 staged / 待 2FA（0.2.0、0.2.1 各卡一次，要人去网页点确认）
#   · Automatic/Publish 令牌要管、要轮换、会泄漏（我们这轮就泄漏过一个）
#   · OIDC 不需要任何长期凭证，npm 还会给包打 provenance 签名（页面显示 Built from …）
#
# 一次性配置（npmjs.com，只做一次）：
#   包页面 → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: marsken88
#     Repository:            dsh-studio
#     Workflow filename:     release.yml
#   配好后这里不需要任何 secret。
#
# 注意：Trusted Publishing 要求 **npm CLI ≥ 11.5.1**，而 GitHub 的 Node 22 自带的是 10.x，
# 所以下面显式把 npm 升到最新版。漏了这步会得到 401/ENEEDAUTH。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC 必需
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 10.x 不认识 trusted publishing，必须升级
      - name: 升级 npm（Trusted Publishing 需要 ≥ 11.5.1）
        run: |
          npm install -g npm@latest
          npm --version

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # tag 必须和 package.json 一致，否则发出去的是错版本
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $PKG 不一致"
            exit 1
          fi

      - name: 语法
        run: node --check index.js && node --check client.src.js

      - name: 契约测试
        run: npm test

      # 产物必须可复现：改了前端没重新构建，这里会红
      - name: 构建
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: 产物一致性
        run: |
          cmp dist/client.js client.js
          git diff --exit-code -- dist/client.js client.js

      - name: 发布到 npm（OIDC，无需令牌）
        run: npm publish --access public --provenance

      - name: 发布后核对
        run: |
          echo "registry latest = $(npm view @marsken/dsh-studio version)"
          npm run verify:release
