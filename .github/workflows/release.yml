name: release

# 打 tag（v0.2.2 这种）自动发版到 npm。凭证走 **Trusted Publishing（OIDC）**，仓库里不放令牌。
#
# 一次性配置（npmjs.com，只做一次）：
#   包页面 → Settings → Trusted Publisher → GitHub Actions
#     Organization or user:  marsken88
#     Repository:             dsh-studio
#     Workflow filename:      release.yml      ← 必须正好是这个名字
#     Environment name:       （留空）
#
# 注意：Trusted Publishing 要求 **npm CLI ≥ 11.5.1**，GitHub 的 Node 22 自带 10.x，
# 所以下面显式升级 npm。漏了会得到 ENEEDAUTH，看着像 OIDC 没生效。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC 必需
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@latest
          npm --version

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $PKG 不一致"
            exit 1
          fi

      - name: 语法
        run: node --check index.js && node --check client.src.js

      - name: 契约测试
        run: npm test

      - name: 构建
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: 产物一致性
        run: |
          cmp dist/client.js client.js
          git diff --exit-code -- dist/client.js client.js

      # 失败原因写成 GitHub annotation：Actions 日志接口对未认证请求是 403，
      # 而 annotations 是公开可读的，这样不用登录也能看到 npm 的真实报错。
      - name: 诊断环境
        run: |
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token endpoint: 可用"
          else
            echo "OIDC token endpoint: 不可用（检查 permissions: id-token: write）"
          fi

      - name: 发布到 npm（OIDC，无需令牌）
        run: |
          # 预发布版本（0.2.2-rc.1 这类）必须显式给 --tag，否则 npm 直接报
          # "You must specify a tag using --tag when publishing a prerelease version"。
          # 正式版不传，交给 npm 默认的 latest。
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in
            *-*) TAG_ARG="--tag next" ;;
            *)   TAG_ARG="" ;;
          esac
          echo "publishing $VER ${TAG_ARG:-(default tag latest)}"
          set +e
          out=$(npm publish --access public --provenance $TAG_ARG 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(echo "$out" | grep -iE "npm error|ENEEDAUTH|E[0-9]{3}|403|401|trusted|provenance" | head -4 | tr '\n' ' ')
            echo "::error::npm publish 失败：$msg"
          fi
          exit $code

      - name: 发布后核对
        if: success()
        run: |
          echo "registry latest = $(npm view @marsken/dsh-studio version)"
          npm run verify:release
