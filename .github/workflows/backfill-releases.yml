name: backfill-releases

# 补建历史 tag 的 GitHub Release。
#
# 为什么需要：仓库有 71 个 tag，但 Releases 页一直是空的 —— release.yml 以前只往 npm 发，
# 从不建 release。tag 只是 git 里的标记，GitHub 不会自动把它变成 Release。
#
# 两种触发：
#   · 推这个文件本身 → 自动跑一次（2026-11-19 用它把 71 个 tag 全补齐了）
#   · Actions → Run workflow → 按输入补（limit 填 all 补全部，dry_run 先看一眼）
#
# 正文来源：工具链里的 tools/changelog-section.mjs 取 CHANGELOG 里这一版那一段；
# 早期有几个版本没写日志（0.2.0~0.2.3），自动退回「列出 prev..tag 的提交 + 对比链接」。

on:
  push:
    paths:
      - '.github/workflows/backfill-releases.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: '补最近多少个 tag（填 all 补全部）'
        required: false
        default: '15'
      dry_run:
        description: '只打印，不创建'
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只允许一个 release 相关写操作：backfill / reorder / release 都要建 release，
# 并发跑会互相「刚建好就被对方删了」，2026-11-19 那次双向触发就是这么红的。
concurrency:
  group: github-releases
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 给缺 release 的 tag 补建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # push 触发时没有 inputs：默认补全部（第一次补齐历史就靠这条，之后都是幂等的跳过）
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="all"; fi
          DRY="${{ inputs.dry_run }}"
          if [ -z "$DRY" ]; then DRY="false"; fi
          echo "limit=$LIMIT dry_run=$DRY event=$GITHUB_EVENT_NAME"

          existing="$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)"
          echo "已有 release：$(echo "$existing" | grep -c . || true) 个"

          mapfile -t ALL < <(git tag --sort=-v:refname)
          NEWEST="${ALL[0]}"
          echo "仓库 tag：${#ALL[@]} 个，最新是 $NEWEST"
          # GitHub 的 Latest 是按 release 的**创建时间**定的，不是版本号。
          # 补历史时如果从新往旧建，最旧的那个会变成 Latest（2026-11-19 就这么踩过），
          # 所以除了最新那个 tag，其余一律 --latest=false。
          LATEST_ARG="--latest=false"
          if [ "$LIMIT" = "all" ]; then
            COUNT=${#ALL[@]}
          else
            COUNT="$LIMIT"
          fi

          created=0
          skipped=0
          failed=0
          for ((i = 0; i < COUNT; i++)); do
            tag="${ALL[$i]}"
            prev="${ALL[$((i + 1))]:-}"
            if echo "$existing" | grep -qx "$tag"; then
              skipped=$((skipped + 1))
              continue
            fi
            ver="${tag#v}"
            notes="$RUNNER_TEMP/notes.md"
            if [ -n "$prev" ]; then
              node tools/changelog-section.mjs "$ver" --prev "$prev" > "$notes"
            else
              node tools/changelog-section.mjs "$ver" > "$notes"
            fi
            if [ "$DRY" = "true" ]; then
              echo "[dry-run] 会建 $tag（prev=${prev:-无}）—— $(head -1 "$notes")"
              continue
            fi
            echo "→ 建 $tag（prev=${prev:-无}）"
            # 有的 tag 可能是轻量 tag，--verify-tag 会拦；失败不中断整轮，最后统一报数字。
            if [ "$tag" = "$NEWEST" ]; then LATEST_ARG="--latest"; else LATEST_ARG="--latest=false"; fi
            # 幂等：并发或重跑时对方可能刚建过，别把它当成失败
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "  已存在 $tag，跳过"
              skipped=$((skipped + 1))
              continue
            fi
            if gh release create "$tag" --title "$tag" --notes-file "$notes" $LATEST_ARG --verify-tag 2>/dev/null \
              || gh release create "$tag" --title "$tag" --notes-file "$notes" $LATEST_ARG; then
              created=$((created + 1))
            else
              failed=$((failed + 1))
              echo "::warning::建 $tag 失败"
            fi
          done
          echo "created=$created skipped=$skipped failed=$failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed 个 tag 建 release 失败"
            exit 1
          fi
